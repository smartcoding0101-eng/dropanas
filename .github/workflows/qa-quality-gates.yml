name: QA System Verification Gates

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  audit-and-quality-gates:
    name: Dropana Quality Gates & Ledger Audit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dropana_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Copy Environment File
        run: cp .env.example .env.testing

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate Application Key
        run: php artisan key:generate --env=testing

      - name: Run Database Migrations
        run: php artisan migrate --env=testing --force

      - name: Gate 1 - Business & Logistics Flows Audit
        run: php artisan test --filter=SystemAuditFlowsTest

      - name: Gate 2 - Stress, Concurrency & Zero-Overselling Tests
        run: php artisan test --filter=SystemAuditStressAndConcurrencyTest

      - name: Gate 3 - Zero-Drift Ledger Reconcile Command
        run: php artisan audit:reconcile-ledgers

      - name: Gate 4 - Full Test Suite (100% Pass Target)
        run: php artisan test

